<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F1F1F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#31ebad" stroke-width="2"/>

  <!-- Decorative inner circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#31ebad" stroke-width="1" opacity="0.3"/>

  <!-- JK Text with cartoonish style -->
  <text
    x="100"
    y="120"
    font-family="Arial, sans-serif"
    font-size="90"
    font-weight="900"
    fill="#31ebad"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#shadow)"
    letter-spacing="2"
    style="font-style: italic; font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;"
  >JK</text>

  <!-- Decorative accent dots -->
  <circle cx="50" cy="50" r="4" fill="#31ebad" opacity="0.6"/>
  <circle cx="150" cy="50" r="4" fill="#31ebad" opacity="0.6"/>
  <circle cx="50" cy="150" r="4" fill="#31ebad" opacity="0.6"/>
  <circle cx="150" cy="150" r="4" fill="#31ebad" opacity="0.6"/>
</svg>